version: "3.9"

services:
  api:
    build: .
    container_name: django-api
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings.production
    networks:
      - axol-network

networks:
  axol-network:
    external: true
    name: axol-network